<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台灣行政區測驗</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Microsoft JhengHei","Noto Sans TC",sans-serif;background:#eeecea;color:#1a1a18;min-height:100vh}
#app{margin:0 auto;padding:0 16px 20px}

/* ───── 開始畫面 ───── */
#start{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:88vh;text-align:center}
#start h1{font-size:26px;font-weight:800;color:#111;letter-spacing:.06em}
#start .sub{font-size:12px;color:#999;letter-spacing:.3em;margin-top:6px}
.card{background:#fff;border:1.5px solid #ddd;border-radius:14px;padding:14px 18px;width:min(440px,94vw);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card h3{font-size:12px;color:#999;letter-spacing:.3em;margin-bottom:10px;font-weight:700}
.optrow{display:flex;gap:8px;justify-content:center}
.opt{flex:1;padding:11px 6px;border-radius:10px;border:1.5px solid #ddd;background:#fafafa;color:#333;
  font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.opt small{display:block;font-weight:400;color:#999;font-size:11px;margin-top:2px}
.opt.sel{border-color:#185FA5;background:#eef4fb;color:#185FA5}
.opt.sel small{color:#5b8cbd}
.opt:not(.sel):hover{border-color:#aaa}
#startSel{font-size:16px;padding:12px 14px;border-radius:11px;border:1px solid #ccc;background:#fff;cursor:pointer;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.06)}
#start .note{font-size:12px;color:#aaa}

/* ───── 遊戲畫面：單行表頭 ───── */
#game{display:none}
#gamebar{position:sticky;top:0;z-index:100;background:#eeecea;padding:10px 0;display:flex;align-items:center;gap:7px}
#selwrap{position:relative;flex-shrink:0}
#gameSel{font-size:14px;font-weight:600;padding:9px 6px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer;
  width:112px;color:transparent;box-shadow:0 1px 3px rgba(0,0,0,.06)}
#gameSel option,#gameSel optgroup{color:#1a1a18}
#gameSelLabel{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:600;color:#1a1a18;pointer-events:none;white-space:nowrap}
#gamebar .spacer{flex:1}
/* 題目卡：浮在地圖上緣中間 */
#topstack{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;
  z-index:15;pointer-events:none;width:max-content;max-width:calc(100% - 24px)}
#prompt{pointer-events:auto;background:rgba(255,255,255,.96);border:1.5px solid #dcdad5;border-radius:16px;
  padding:clamp(7px,.8vh,12px) clamp(16px,1.6vw,28px);box-shadow:0 4px 18px rgba(30,40,60,.13);
  display:flex;align-items:baseline;justify-content:center;gap:clamp(6px,.6vw,10px);text-align:center;min-width:150px;max-width:100%}
#prompt[hidden]{display:none}
#prompt-label{font-size:clamp(12px,.6vw + .5vh,16px);color:#888;font-weight:700;letter-spacing:.1em;white-space:nowrap}
#target{font-size:clamp(22px,1.6vw + 1.6vh + 4px,42px);font-weight:900;color:#185FA5;letter-spacing:.06em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prompt.mc #prompt-label{font-size:clamp(16px,1vw + 1vh + 2px,28px);font-weight:900;color:#1a1a18;letter-spacing:.05em}
#prompt.mc #target{display:none}
#target:empty::before{content:"\00a0"}
.hbtn{padding:9px 12px;border-radius:10px;border:1px solid #ccc;background:#fff;color:#333;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:.15s}
.hbtn:hover{background:#f7f6f3}
.hbtn:disabled{opacity:.35;cursor:default}
#btnQuit.arm{border-color:#c0392b;color:#c0392b;background:#fdedec}
@media (max-width:430px){
  #gameSel{width:96px;font-size:13px}
  #gameSelLabel{font-size:13px}
  #btnHint{padding:9px 9px}
}

/* ───── 地圖 ───── */
.inset-frame{fill:#f6f8fb;stroke:#c3ccd8;stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke;pointer-events:none}
.inset-note{font-size:7.5px;fill:#8a94a3;text-anchor:middle;pointer-events:none}
#map-wrap{position:relative;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
svg{width:100%;height:auto;display:block;cursor:pointer}
/* 地圖區一律吃滿視窗剩餘高度（電腦、大螢幕、手機皆同；圖形自動置中） */
#map{height:calc(100vh - 92px);height:calc(100dvh - 92px)}
#game.mc #map{height:calc(100vh - 212px);height:calc(100dvh - 212px);min-height:240px}
.dist{fill:#ccc9be;stroke:#fff;stroke-width:.8;transition:fill .1s;vector-effect:non-scaling-stroke}
.dist:hover{fill:#aaa79e}
.dist.review-dim{fill:#e5e4df !important}
.dist.result-g{fill:#97C459 !important}
.dist.result-y{fill:#F2C14E !important}
.dist.result-r{fill:#F08080 !important}
.dist.flash-g{animation:flashG .65s ease forwards}
.dist.flash-y{animation:flashY .65s ease forwards}
.dist.flash-r{animation:flashR .65s ease forwards}
.dist.flash-bad{animation:flashBad .55s ease forwards}
.dist.target{fill:#FFD54F !important;animation:pulse 1s ease-in-out infinite}
@keyframes flashG{0%{fill:#97C459}100%{fill:#ccc9be}}
@keyframes flashY{0%{fill:#F2C14E}100%{fill:#ccc9be}}
@keyframes flashR{0%{fill:#F08080}100%{fill:#ccc9be}}
@keyframes flashBad{0%{fill:#F7A0A0}100%{fill:#ccc9be}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){.dist.target{animation:none}}
#review-labels text{font-size:8px;fill:#222;pointer-events:none;text-anchor:middle;dominant-baseline:middle}

/* 地圖上的浮動元件 */
#map-stats{position:absolute;display:none;flex-direction:column;gap:5px;pointer-events:none;z-index:10;padding:10px}
.map-stat{background:rgba(255,255,255,.88);backdrop-filter:blur(4px);border-radius:9px;padding:6px 11px;text-align:center;min-width:60px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.map-stat-n{font-size:17px;font-weight:700;color:#111;line-height:1.15}
.map-stat-n .of{font-size:11px;font-weight:500;color:#999}
.map-stat-l{font-size:10px;color:#888;margin-top:1px;letter-spacing:.03em}
.map-stat.dots{display:flex;gap:8px;font-size:12px;font-weight:700;justify-content:center;align-items:center}
.map-stat.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:-1px}
#btnReview{position:absolute;right:10px;top:10px;z-index:20;padding:6px 12px;border-radius:9px;border:1.5px solid #185FA5;
  background:rgba(255,255,255,.94);color:#14497e;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
#btnReview.on{background:#185FA5;color:#fff}
#zoom-controls{position:absolute;bottom:10px;right:10px;display:none;flex-direction:column;gap:4px;z-index:20}
.zoom-btn{width:32px;height:32px;border-radius:8px;border:1px solid #ccc;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:#333;line-height:1}
.zoom-btn:hover{background:#fff}
#toast{transform:translateY(-8px);background:rgba(255,255,255,.97);
  border:1.5px solid #ddd;border-radius:999px;padding:7px 18px;font-weight:700;font-size:14px;
  opacity:0;transition:.25s;pointer-events:none;z-index:150;box-shadow:0 2px 10px rgba(0,0,0,.1);max-width:100%;text-align:center}
#toast.show{opacity:1;transform:translateY(0)}
/* 電腦版：縣市選單與按鈕浮在地圖左上角；統計小卡固定在左下角 */
@media (min-width:760px){
  #map-wrap #gamebar{position:absolute;top:12px;left:12px;z-index:25;flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px;
    background:rgba(255,255,255,.95);border:1.5px solid #dcdad5;border-radius:14px;box-shadow:0 4px 18px rgba(30,40,60,.12)}
  #map-wrap #gamebar .spacer{display:none}
  #map-wrap #gamebar #gameSel{width:100%}
  #map-wrap #gamebar .hbtn{font-size:14px}
  #map-wrap #gamebar .btnrow{display:flex;gap:6px}
  #map-wrap #gamebar .btnrow .hbtn{flex:1}
  #game:not(.mc) #map-wrap #map{height:calc(100vh - 30px);height:calc(100dvh - 30px)}
  #game.mc #map-wrap #map{height:calc(100vh - 150px);height:calc(100dvh - 150px)}
  #app{padding-top:14px}
}
#gamebar .btnrow{display:flex;gap:7px}
#gamebar #btnReview{position:static;padding:9px 12px;border-radius:10px;font-size:13px;white-space:nowrap;flex-shrink:0}
#toast.ok{color:#1e8449}#toast.no{color:#c0392b}#toast.info{color:#185FA5}

/* ───── 選擇題 ───── */
#choices{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#choices button{padding:13px 10px;border-radius:11px;border:1.5px solid #ddd;background:#fff;
  color:#333;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.12s}
#choices button:not(:disabled):hover{border-color:#185FA5}
#choices button.c-ok{border-color:#27ae60;background:#eafaf1;color:#1e8449}
#choices button.c-no{border-color:#c0392b;background:#fdedec;color:#c0392b;opacity:.75}
#choices button:disabled{cursor:default}

/* ───── 結算 ───── */
#result-panel{display:none;background:#fff;border-radius:14px;padding:20px 16px 16px;margin-bottom:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#result-panel h2{font-size:16px;font-weight:600;color:#333;margin-bottom:2px}
#big-acc{font-size:48px;font-weight:800;color:#185FA5;margin:6px 0 4px;letter-spacing:-.02em}
#res-detail{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
#res-mistakes{font-size:13px;color:#888;line-height:2;margin-bottom:14px}
#res-mistakes b{color:#922b21}
.result-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.result-actions button{font-size:13px;padding:9px 18px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer;font-weight:600;font-family:inherit}
.result-actions button:hover{background:#f0efec}
.result-actions button.primary{background:#185FA5;color:#fff;border-color:#185FA5}
.result-actions button.primary:hover{background:#1a6abf}

/* ───── 確認對話框 ───── */
#confirm-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;align-items:center;justify-content:center;padding:20px}
#confirm-mask.show{display:flex}
#confirm-card{background:#fff;border-radius:14px;padding:20px 22px 18px;max-width:320px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.2)}
#confirm-msg{font-size:15px;font-weight:600;color:#333;line-height:1.7;margin-bottom:16px}
#confirm-msg small{display:block;color:#999;font-weight:400;font-size:12.5px;margin-top:3px}
.confirm-btns{display:flex;gap:8px}
.confirm-btns button{flex:1;font-size:14px;padding:10px 0;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer;font-weight:600;font-family:inherit}
.confirm-btns button:hover{background:#f0efec}
.confirm-btns .primary{background:#185FA5;color:#fff;border-color:#185FA5}
.confirm-btns .primary:hover{background:#1a6abf}
</style>
</head>
<body>
<div id="app">

  <!-- 開始畫面 -->
  <div id="start">
    <div>
      <h1>🇹🇼 台灣行政區測驗</h1>
      <p class="sub">DISTRICTS&nbsp;OF&nbsp;TAIWAN</p>
    </div>
    <div class="card">
      <h3>測驗模式</h3>
      <div class="optrow" id="modeRow">
        <button class="opt sel" data-mode="click">🗺️ 地圖點選<small>依名稱點出位置</small></button>
        <button class="opt" data-mode="mc">📝 選擇題<small>看位置選出名稱</small></button>
        <button class="opt" data-mode="review">🔍 複習地圖<small>看地名認位置</small></button>
      </div>
    </div>
    <div class="card">
      <h3>選擇縣市</h3>
      <select id="startSel"><option value="">-- 請選擇縣市，立即開始 --</option></select>
    </div>
    <p class="note">選擇縣市後即開始測驗；遊戲中也可隨時切換</p>
  </div>

  <!-- 遊戲畫面 -->
  <div id="game">
    <div id="gamebar">
      <div id="selwrap"><select id="gameSel"></select><span id="gameSelLabel"></span></div>
      <span class="spacer"></span>
      <div class="btnrow">
        <button class="hbtn" id="btnHint">💡 提示</button>
        <button id="btnReview">🗺 複習</button>
        <button class="hbtn" id="btnQuit">✕</button>
      </div>
    </div>

    <div id="result-panel">
      <h2 id="res-title"></h2>
      <div id="big-acc"></div>
      <div id="res-detail"></div>
      <div id="res-mistakes"></div>
      <div class="result-actions">
        <button class="primary" id="btnAgain">再玩一次</button>
        <button id="btnRetry">錯題重測</button>
        <button id="btnNext"></button>
      </div>
    </div>

    <div id="map-wrap">
      <svg id="map" viewBox="0 0 500 500"></svg>
      <div id="topstack">
        <div id="prompt">
          <span id="prompt-label">請點選</span>
          <span id="target"></span>
        </div>
        <div id="toast"></div>
      </div>
      <div id="map-stats"></div>
      <div id="zoom-controls">
        <button class="zoom-btn" id="btnZin" title="放大">＋</button>
        <button class="zoom-btn" id="btnZout" title="縮小">－</button>
        <button class="zoom-btn" id="btnZreset" title="重置" style="font-size:13px">⊙</button>
      </div>
    </div>

    <div id="choices"></div>
  </div>

  <!-- 確認對話框 -->
  <div id="confirm-mask">
    <div id="confirm-card">
      <div id="confirm-msg"></div>
      <div class="confirm-btns">
        <button id="confirmCancel">取消</button>
        <button id="confirmOk" class="primary">確認</button>
      </div>
    </div>
  </div>

</div>

let session=0,currentK=1,autoZoomed=false;
let labelMode=null,labelGroups=[];

function later(fn,ms){const s=session;setTimeout(()=>{if(s===session)fn();},ms);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function quizActive(){return currentCounty&&!quizFinished&&!inReview&&pool.length>0&&idx<pool.length;}
function quizHasProgress(){return quizActive()&&(idx>0||attempts>0||usedHint);}

/* ── toast ── */
let toastTimer=null;
function toast(msg,cls,ms){
  const t=$('toast');
  t.textContent=msg;t.className='show '+cls;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.className='',ms||1300);
}

/* ── 開始畫面：模式選擇 ── */
document.querySelectorAll('#modeRow .opt').forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode; syncModeButtons();
});
function syncModeButtons(){
  document.querySelectorAll('#modeRow .opt').forEach(x=>x.classList.toggle('sel',x.dataset.mode===mode));
}
function quizMode(){return mode==='mc'?'mc':'click';}

/* ── 確認對話框 ── */
let confirmCb=null;
function askConfirm(msg,okLabel,cb){
  $('confirm-msg').innerHTML=msg;
  $('confirmOk').textContent=okLabel||'確認';
  confirmCb=cb;
  $('confirm-mask').classList.add('show');
}
function closeConfirm(){$('confirm-mask').classList.remove('show');confirmCb=null;}
$('confirmCancel').onclick=closeConfirm;
$('confirm-mask').onclick=e=>{if(e.target.id==='confirm-mask')closeConfirm();};
$('confirmOk').onclick=()=>{const cb=confirmCb;closeConfirm();if(cb)cb();};

/* ── 縣市切換（遊戲中需確認） ── */
$('startSel').onchange=e=>{ if(e.target.value) selectCounty(e.target.value); };
$('gameSel').onchange=e=>{
  const v=e.target.value;
  if(!v||v===currentCounty){e.target.value=currentCounty||'';return;}
  if(quizHasProgress()){
    e.target.value=currentCounty;
    askConfirm('測驗進行中，確認切換到「'+v+'」？<small>目前進度將不保留</small>','確認切換',()=>selectCounty(v));
  }else{
    selectCounty(v);
  }
};

function selectCounty(name){
  if(!DATA[name])return;
  currentCounty=name;
  $('gameSel').value=name;
  gsLabel();
  $('start').style.display='none';
  $('game').style.display='block';
  buildMap(name);
  if(inReview||mode==='review') enterReview(); else startQuiz();
}

/* ── 遠方離島內嵌框：主圖只依其餘島嶼縮放，遠方的島另畫在角落的框裡
   每縣可有多個框；parts：整個鄉鎮 {town}，或只取某鄉鎮北緯 minLat 以北的島 {town,minLat}
   box=[x0,y0,x1,y1]（viewBox 座標，寬固定 500）；避開左上角計分小卡與右上角按鈕 */
const INSETS={
  '金門縣':[{parts:[{town:'烏坵鄉'}],box:[8,46,126,138],note:'↗ 東北方約 120 公里'}],
  '連江縣':[{parts:[{town:'東引鄉'}],box:[372,40,495,118],note:'↗ 東北方約 55 公里'},
           {parts:[{town:'北竿鄉',minLat:26.32}],box:[372,126,495,186],note:'↗ 亮島・東北方約 25 公里'}]
};
/* 把某鄉鎮的多邊形依緯度拆成兩組（用外環座標平均緯度判斷） */
function splitByLat(f,minLat){
  const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
  const lat=p=>p[0].reduce((s,c)=>s+c[1],0)/p[0].length;
  const mk=ps=>ps.length?{type:'Feature',properties:f.properties,geometry:{type:'MultiPolygon',coordinates:ps}}:null;
  return {near:mk(polys.filter(p=>lat(p)<minLat)), far:mk(polys.filter(p=>lat(p)>=minLat))};
}

/* ── 建地圖 ── */
function buildMap(name){
  const d=DATA[name];
  const topo={type:'Topology',transform:d.t,arcs:d.a,objects:{towns:{type:'GeometryCollection',
    geometries:d.g.map(g=>({type:g.type,arcs:g.arcs,properties:{name:g.properties.n}}))}}};
  const features=topojson.feature(topo,topo.objects.towns).features;
  const insetGroups=[];
  (INSETS[name]||[]).forEach(ins=>{
    const feats=[];
    ins.parts.forEach(sp=>{
      const i=features.findIndex(f=>f.properties.name===sp.town); if(i<0) return;
      if(sp.minLat==null){ feats.push(features.splice(i,1)[0]); return; }
      const {near,far}=splitByLat(features[i],sp.minLat);
      if(!far) return;
      feats.push(far);
      if(near) features[i]=near; else features.splice(i,1);
    });
    if(feats.length) insetGroups.push({ins,feats});
  });
  const proj0=d3.geoMercator().fitSize([500,500],{type:'FeatureCollection',features});
  const pg0=d3.geoPath().projection(proj0);
  let minY=Infinity,maxY=-Infinity;
  features.forEach(f=>{const b=pg0.bounds(f);if(b[0][1]<minY)minY=b[0][1];if(b[1][1]>maxY)maxY=b[1][1];});
  svgH=Math.max(180,Math.min(Math.round(maxY-minY+40),560));
  const svgEl=$('map');
  svgEl.setAttribute('viewBox','0 0 500 '+svgH);
  svgEl.innerHTML='';
  const pathGen=d3.geoPath().projection(d3.geoMercator().fitSize([500,svgH],{type:'FeatureCollection',features}));

  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.id='map-g'; svgEl.appendChild(g);

  pathEls={};centroids={};bboxes={};labelGroups=[];labelMode=null;
  const items=features.map(f=>({f,pg:pathGen,main:true}));
  insetGroups.forEach(({ins,feats})=>{
    const [x0,y0,x1,y1]=ins.box, NS='http://www.w3.org/2000/svg';
    const fr=document.createElementNS(NS,'rect');
    fr.setAttribute('class','inset-frame');
    fr.setAttribute('x',x0);fr.setAttribute('y',y0);fr.setAttribute('width',x1-x0);fr.setAttribute('height',y1-y0);fr.setAttribute('rx',6);
    g.appendChild(fr);
    const nt=document.createElementNS(NS,'text');
    nt.setAttribute('class','inset-note');nt.setAttribute('x',(x0+x1)/2);nt.setAttribute('y',y1-6);
    nt.textContent=ins.note; g.appendChild(nt);
    const ip=d3.geoPath().projection(d3.geoMercator().fitExtent([[x0+14,y0+10],[x1-14,y1-20]],{type:'FeatureCollection',features:feats}));
    feats.forEach(f=>items.push({f,pg:ip,main:false}));
  });
  /* 同一鄉鎮的主圖部分與框內部分合成一個可點選的區域；標籤／提示以主圖部分為準 */
  const byTown=new Map();
  items.forEach(it=>{const n=it.f.properties.name; if(!byTown.has(n)) byTown.set(n,[]); byTown.get(n).push(it);});
  byTown.forEach((its,dname)=>{
    const ref=its.find(it=>it.main)||its[0];
    const f=ref.f, pathGen=ref.pg;
    const el=document.createElementNS('http://www.w3.org/2000/svg','path');
    el.setAttribute('class','dist'); el.setAttribute('d',its.map(it=>it.pg(it.f)).join(''));
    el.addEventListener('click',()=>handleClick(dname));
    g.appendChild(el); pathEls[dname]=el;
    try{
      const c=pathGen.centroid(f);
      if(c&&!isNaN(c[0])&&!isNaN(c[1]))centroids[dname]=c;
      const b=pathGen.bounds(f);
      bboxes[dname]=[b[0][0],b[0][1],b[1][0],b[1][1]];
    }catch(e){}
  });

  const zoom=d3.zoom().scaleExtent([0.5,12]).on('zoom',e=>{
    g.setAttribute('transform',e.transform.toString());
    currentK=e.transform.k;
    updateLabelScale();
  });
  d3.select(svgEl).call(zoom);
  d3.select(svgEl).on('dblclick.zoom',()=>{
    d3.select(svgEl).transition().duration(400).call(zoom.transform,homeT());
  });
  svgEl._zoom=zoom;
  d3.select(svgEl).call(zoom.transform,d3.zoomIdentity);
  currentK=1;

  positionStats();
  d3.select(svgEl).call(zoom.transform,homeT());
  $('zoom-controls').style.display='flex';
}

/* 統計小卡固定在左下角（上緣中間是題目卡、右下是縮放鈕） */
function positionStats(){
  const st=$('map-stats');
  st.style.top='';st.style.left='0';st.style.bottom='0';
}

/* ── 縮放 ── */
function zoomBy(f){const s=$('map');if(!s._zoom)return;d3.select(s).transition().duration(250).call(s._zoom.scaleBy,f);}
function zoomReset(){const s=$('map');if(!s._zoom)return;d3.select(s).transition().duration(300).call(s._zoom.transform,homeT());}
/* 浮在地圖上的元件（題目卡、電腦版左上角面板）不可蓋住地圖：
   在原始比例下檢查它們底下有沒有鄉鎮；有的話把整張圖縮小並往下移，讓地圖上緣退到元件下方 */
function hudFloating(){ return !!$('gamebar').closest('#map-wrap'); }
function coversLand(r){
  for(let y=r.top+3;y<r.bottom;y+=8) for(let x=r.left+3;x<r.right;x+=8)
    for(const n of document.elementsFromPoint(x,y)) if(n.classList&&n.classList.contains('dist')) return true;
  return false;
}
function homeT(){
  const s=$('map'), g=$('map-g'); if(!g||!s._zoom) return d3.zoomIdentity;
  const keep=g.getAttribute('transform'); g.removeAttribute('transform');
  let needT=0, needB=Infinity;
  [$('prompt'), hudFloating()?$('gamebar'):null].forEach(el=>{
    if(!el||el.hidden||!el.offsetParent) return;
    const r=el.getBoundingClientRect(); if(coversLand(r)) needT=Math.max(needT,r.bottom+8);
  });
  const st=$('map-stats');
  if(st.offsetParent&&getComputedStyle(st).display!=='none'){
    const q=[...st.children].map(c=>c.getBoundingClientRect()).filter(r=>r.width);
    if(q.length){ const r={left:Math.min(...q.map(a=>a.left)),right:Math.max(...q.map(a=>a.right)),top:Math.min(...q.map(a=>a.top)),bottom:Math.max(...q.map(a=>a.bottom))};
      if(coversLand(r)) needB=r.top-6; }
  }
  let t=d3.zoomIdentity;
  if(needT>0||needB<Infinity){
    const M=g.getScreenCTM(), bb=g.getBBox();
    const y0=bb.y, y1=bb.y+bb.height, cx=bb.x+bb.width/2;
    const ny=needT>0?(needT-M.f)/M.d:y0, nb=needB<Infinity?(needB-M.f)/M.d:y1;
    const top=Math.max(ny,y0), bot=Math.min(nb,y1);
    if(top>y0||bot<y1){
      const k=Math.max(0.5,Math.min(1,(bot-top)/(y1-y0)));
      const ty=top+((bot-top)-k*(y1-y0))/2-k*y0;
      t=d3.zoomIdentity.translate(cx*(1-k),ty).scale(k);
    }
  }
  if(keep) g.setAttribute('transform',keep);
  return t;
}
/* 電腦版把縣市選單與按鈕搬進地圖左上角；手機版放回地圖上方 */
const deskMQ=window.matchMedia('(min-width:760px)');
function placeBar(){
  const bar=$('gamebar'), wrap=$('map-wrap');
  if(deskMQ.matches){ if(bar.parentNode!==wrap) wrap.insertBefore(bar,wrap.firstChild); }
  else if(bar.parentNode===wrap) $('game').insertBefore(bar,$('game').firstChild);
  if(currentCounty) positionStats();
}
deskMQ.addEventListener('change',()=>{placeBar(); if(currentCounty) zoomReset();});
placeBar();
$('btnZin').onclick=()=>zoomBy(1.5);
$('btnZout').onclick=()=>zoomBy(1/1.5);
$('btnZreset').onclick=zoomReset;

/* 自動聚焦某區：frac = 該區約占畫面的比例；區域夠大就不縮放 */
function zoomToBBox(name,frac){
  const b=bboxes[name];if(!b)return;
  const w=Math.max(b[2]-b[0],1),h=Math.max(b[3]-b[1],1);
  let k=Math.min(500/w,svgH/h)*frac;
  k=Math.min(8,Math.max(1,k));
  if(k<1.25){zoomReset();return;}
  const cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;
  const t=d3.zoomIdentity.translate(250-k*cx,svgH/2-k*cy).scale(k);
  const s=$('map');
  d3.select(s).transition().duration(420).call(s._zoom.transform,t);
}

/* ── 地名標籤（複習/結算）：畫在 map-g 內、但反向縮放，避免放大後字爆大 ── */
const LBL_FS=8,LBL_CAP_PX=15;
function clearLabels(){
  labelMode=null;labelGroups=[];
  const lg=document.getElementById('review-labels');if(lg)lg.remove();
}
function drawLabels(kind){
  clearLabels();labelMode=kind;
  const g=document.getElementById('map-g');if(!g)return;
  const lg=document.createElementNS('http://www.w3.org/2000/svg','g');
  lg.id='review-labels';g.appendChild(lg);
  Object.entries(centroids).forEach(([name,[cx,cy]])=>{
    const grp=document.createElementNS('http://www.w3.org/2000/svg','g');
    const tw=name.length*8.5+8,th=13;
    const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x',-tw/2);rect.setAttribute('y',-th/2);
    rect.setAttribute('width',tw);rect.setAttribute('height',th);
    let bg='rgba(255,255,255,0.85)';
    if(kind==='result'){
      const s=districtStatus[name];
      bg=s==='g'?'rgba(180,230,130,0.9)':s==='y'?'rgba(250,220,130,0.92)':s==='r'?'rgba(255,180,180,0.9)':'rgba(255,255,255,0.7)';
    }
    rect.setAttribute('fill',bg);rect.setAttribute('rx','2');
    rect.setAttribute('pointer-events','none');grp.appendChild(rect);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',0);t.setAttribute('y',1);
    t.setAttribute('pointer-events','none');t.textContent=name;
    grp.appendChild(t);lg.appendChild(grp);
    labelGroups.push({grp,cx,cy});
  });
  updateLabelScale();
}
function updateLabelScale(){
  if(!labelMode||!labelGroups.length)return;
  const sBase=$('map').clientWidth/500;
  if(!isFinite(sBase)||sBase<=0)return;
  const q=Math.min(1,LBL_CAP_PX/(LBL_FS*sBase*currentK));
  labelGroups.forEach(L=>L.grp.setAttribute('transform','translate('+L.cx+','+L.cy+') scale('+q+')'));
}
window.addEventListener('resize',updateLabelScale);

/* ── 測驗流程 ── */
function startQuiz(subset){
  session++;inReview=false;quizFinished=false;autoZoomed=false;
  disarmQuit();setReviewBtn('idle');
  pool=shuffle((subset||Object.keys(pathEls)).slice());
  idx=0;districtStatus={};
  Object.values(pathEls).forEach(el=>el.setAttribute('class','dist'));
  clearLabels();
  $('result-panel').style.display='none';
  $('map-stats').style.display='flex';
  const m=quizMode();
  $('prompt').hidden=false;
  $('prompt').classList.toggle('mc',m==='mc');
  $('prompt-label').textContent=m==='click'?'請點選':'閃爍的是？';
  $('btnHint').style.display=m==='click'?'':'none';
  $('choices').style.display=m==='mc'?'grid':'none';
  $('game').classList.toggle('mc',m==='mc');
  zoomReset();
  nextQ();
}

function clearTargets(){Object.values(pathEls).forEach(el=>el.classList.remove('target'));}

function nextQ(){
  if(idx>=pool.length){endGame();return;}
  attempts=0;usedHint=false;locked=false;
  $('btnHint').disabled=false;
  const t=pool[idx];
  if(quizMode()==='click'){
    if(autoZoomed){zoomReset();autoZoomed=false;}
    $('target').textContent=t;
  }else{
    $('target').textContent='';
    clearTargets();pathEls[t].classList.add('target');
    zoomToBBox(t,0.3);
    buildChoices(t);
  }
  updateStats();
}

function grade(){
  let g=attempts===0?'g':attempts===1?'y':'r';
  if(usedHint&&g==='g')g='y';
  return g;
}

function flash(name,cls){
  const el=pathEls[name];if(!el)return;
  el.classList.remove('flash-g','flash-y','flash-r','flash-bad');
  void el.offsetWidth;el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls),700);
}

function handleClick(name){
  if(inReview){reviewPeek(name);return;}
  if(quizMode()!=='click'||locked||!quizActive())return;
  const t=pool[idx];
  if(name===t){
    locked=true;
    const gr=grade();
    districtStatus[t]=gr;
    clearTargets();flash(t,'flash-'+gr);
    toast('✓ '+t,'ok');
    idx++;updateStats();
    later(nextQ,620);
  }else{
    attempts++;
    flash(name,'flash-bad');
    if(attempts>=3){
      locked=true;districtStatus[t]='r';
      clearTargets();pathEls[t].classList.add('target');
      toast('正確位置：「'+t+'」在這裡','no',1700);
      zoomToBBox(t,0.25);autoZoomed=true;
      idx++;updateStats();
      later(()=>{pathEls[t].classList.remove('target');nextQ();},1850);
    }else{
      toast('那是「'+name+'」，再試一次！','no');
    }
  }
}

$('btnHint').onclick=()=>{
  if(quizMode()!=='click'||locked||!quizActive())return;
  usedHint=true;$('btnHint').disabled=true;
  const t=pool[idx];
  clearTargets();pathEls[t].classList.add('target');
  toast('看到閃爍的位置了嗎？（用提示最高算黃燈）','info',2200);
  later(()=>pathEls[t].classList.remove('target'),2400);
};

/* ── 選擇題 ── */
function buildChoices(t){
  const all=Object.keys(pathEls).filter(n=>n!==t);
  const c=centroids[t]||[250,svgH/2];
  all.sort((a,b)=>{
    const ca=centroids[a]||[0,0],cb=centroids[b]||[0,0];
    return Math.hypot(ca[0]-c[0],ca[1]-c[1])-Math.hypot(cb[0]-c[0],cb[1]-c[1]);
  });
  const near=all.slice(0,Math.min(7,all.length));
  const opts=shuffle([t,...shuffle(near).slice(0,3)]);
  const box=$('choices');box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.textContent=o;
    b.onclick=()=>{
      if(locked||!quizActive())return;
      if(o===t){
        locked=true;b.classList.add('c-ok');
        const gr=attempts===0?'g':attempts===1?'y':'r';
        districtStatus[t]=gr;
        clearTargets();flash(t,'flash-'+gr);
        toast('✓ '+t,'ok');
        idx++;updateStats();
        later(nextQ,820);
      }else{
        attempts++;
        b.classList.add('c-no');b.disabled=true;
        if(attempts>=3){
          locked=true;districtStatus[t]='r';
          clearTargets();flash(t,'flash-r');
          toast('正確答案：「'+t+'」','no',1500);
          idx++;updateStats();
          later(nextQ,1550);
        }else{
          toast('再試一次！','no');
        }
      }
    };
    box.appendChild(b);
  });
}

/* ── 統計小卡 ── */
function updateStats(){
  const v=Object.values(districtStatus);
  const g=v.filter(s=>s==='g').length,y=v.filter(s=>s==='y').length,r=v.filter(s=>s==='r').length;
  $('map-stats').innerHTML=
    '<div class="map-stat"><div class="map-stat-n">'+Math.min(idx+1,pool.length)+'<span class="of"> / '+pool.length+'</span></div><div class="map-stat-l">題目</div></div>'+
    '<div class="map-stat dots">'+
      '<span><i style="background:#97C459"></i>'+g+'</span>'+
      '<span><i style="background:#F2C14E"></i>'+y+'</span>'+
      '<span><i style="background:#F08080"></i>'+r+'</span>'+
    '</div>';
}

/* ── 結算 ── */
function endGame(){
  quizFinished=true;locked=true;
  $('game').classList.remove('mc');
  $('map-stats').style.display='none';
  $('choices').style.display='none';
  $('btnHint').disabled=true;
  $('prompt-label').textContent='測驗結束';
  $('target').textContent='';
  const v=pool.map(n=>districtStatus[n]);
  const g=v.filter(s=>s==='g').length,y=v.filter(s=>s==='y').length,r=v.filter(s=>s==='r').length;
  const pct=pool.length?Math.round((g+y*0.5)/pool.length*100):0;
  $('res-title').textContent=currentCounty+'・'+pool.length+' 區測驗完成';
  $('big-acc').textContent=pct+' 分';
  $('res-detail').innerHTML=
    '<span style="color:#1e8449">一次答對 '+g+'</span>'+
    '<span style="color:#b8860b">兩次內 '+y+'</span>'+
    '<span style="color:#c0392b">未答對 '+r+'</span>';
  const wrong=pool.filter(n=>districtStatus[n]!=='g');
  $('res-mistakes').innerHTML=wrong.length
    ?'需要複習：'+wrong.map(n=>'<b>'+n+'</b>').join('、')
    :'全部一次答對，太厲害了！🎉';
  $('btnRetry').style.display=wrong.length?'':'none';
  $('btnRetry').onclick=()=>startQuiz(wrong);
  const nx=nextCounty();
  $('btnNext').textContent='下一個縣市：'+nx+' →';
  $('btnNext').onclick=()=>selectCounty(nx);
  /* 結果地圖：三色 + 未考的變淡 + 上色標籤 */
  Object.entries(pathEls).forEach(([n,el])=>{
    el.setAttribute('class','dist');
    if(pool.includes(n))el.classList.add('result-'+(districtStatus[n]||'r'));
    else el.classList.add('review-dim');
  });
  drawLabels('result');
  zoomReset();
  $('result-panel').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
$('btnAgain').onclick=()=>startQuiz();

function nextCounty(){
  const i=COUNTY_ORDER.indexOf(currentCounty);
  for(let j=1;j<=COUNTY_ORDER.length;j++){
    const n=COUNTY_ORDER[(i+j)%COUNTY_ORDER.length];
    if(DATA[n])return n;
  }
  return currentCounty;
}

/* ── 複習模式（地圖右上角切換） ── */
function setReviewBtn(state){
  const b=$('btnReview');
  b.classList.remove('on');
  if(state==='on'){b.classList.add('on');b.textContent='▶ 回到測驗';}
  else b.textContent='🗺 複習';
}
$('btnReview').onclick=()=>{
  if(inReview){
    if(mode==='review'){mode='click';syncModeButtons();}
    startQuiz();return;
  }
  if(quizHasProgress()){
    askConfirm('進入複習地圖？<small>目前測驗進度將不保留</small>','進入複習',enterReview);
    return;
  }
  enterReview();
};
function enterReview(){
  session++;inReview=true;quizFinished=false;
  pool=[];idx=0;districtStatus={};
  disarmQuit();setReviewBtn('on');
  $('game').classList.remove('mc');
  $('map-stats').style.display='none';
  $('choices').style.display='none';
  $('result-panel').style.display='none';
  $('btnHint').style.display='none';
  $('prompt').hidden=true;
  $('prompt-label').textContent='';
  $('target').textContent='複習模式';
  Object.values(pathEls).forEach(el=>el.setAttribute('class','dist review-dim'));
  drawLabels('review');
  zoomReset();
}
function reviewPeek(name){
  clearTargets();
  const el=pathEls[name];if(!el)return;
  el.classList.add('target');
  toast(name,'info',1600);
  later(()=>el.classList.remove('target'),1600);
}

/* ── 離開（兩段式確認） ── */
let quitTimer=null;
function disarmQuit(){clearTimeout(quitTimer);quitTimer=null;const q=$('btnQuit');q.textContent='✕';q.classList.remove('arm');}
$('btnQuit').onclick=()=>{
  if(inReview||quizFinished||!quizHasProgress()||quitTimer){goHome();return;}
  const q=$('btnQuit');
  q.textContent='確定離開？';q.classList.add('arm');
  quitTimer=setTimeout(disarmQuit,2500);
};
function goHome(){
  session++;disarmQuit();
  currentCounty=null;inReview=false;quizFinished=false;pool=[];
  $('game').style.display='none';
  $('start').style.display='flex';
  $('startSel').value='';$('gameSel').value='';gsLabel();
  $('toast').className='';
  setReviewBtn('idle');
}
</script>
